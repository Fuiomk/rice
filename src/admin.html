<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>205点饭系统 - 后台</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <style>

        :root, [data-theme="light"], [data-theme="dark"] {
            --bg-glow-1: #25142c;
            --bg-glow-2: #0b0711;

            --pink: #ff91bd;
            --cyan: #8deaff;
            --gold: #ffe29a;

            --tri-gradient: linear-gradient(90deg, #ff91bd, #d9a2ff, #ffdf9a);

            --card-bg: #0b0810;
            --card-border: #ffffff10;
            --card-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            --card-shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.65);
            --card-inner-glow: inset 0 1px 0 rgba(255, 255, 255, 0.04);

            --text-primary: #eee;
            --text-secondary: #9d96a4;
            --text-tertiary: #8f8792;

            --accent-pink: #ff91bd;
            --accent-pink-deep: #ff91bd;
            --accent-pink-glow: rgba(255, 145, 189, 0.22);
            --accent-purple: #d9a2ff;
            --accent-purple-deep: #d9a2ff;
            --accent-purple-glow: rgba(217, 162, 255, 0.18);
            --accent-mint: #8deaff;

            --surface-light: #ffffff08;
            --surface-medium: #ffffff0d;
            --surface-tag: #ffffff0a;

            --border-soft: #ffffff10;
            --border-medium: #ff91bd55;

            --gradient-primary: var(--tri-gradient);
            --gradient-badge: rgba(255, 145, 189, 0.12);

            --input-bg: #ffffff08;
            --table-row-bg: #ffffff05;
            --order-row-bg: #ffffff05;
            --order-row-hover: #ffffff0a;

            --divider: #ffffff0d;
            --danger-bg: rgba(255, 145, 189, 0.1);

            --scrollbar-track: transparent;
            --scrollbar-thumb: #ffffff1f;

            --toast-bg: #14101c;
            --toast-fg: #ffffff;
            --toast-border: #ffffff18;
            --toast-error-bg: #2a0f1c;
            --toast-error-fg: #ffb8cf;
            --toast-error-border: rgba(255, 184, 207, 0.25);

            color-scheme: dark;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        * { font-family: 'Noto Sans SC', 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            /* 夜空辉光，与点饭页同一写法 */
            background: radial-gradient(circle at 50% 15%, var(--bg-glow-1) 0, var(--bg-glow-2) 42%, #030308 100%);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            padding: max(18px, env(safe-area-inset-top))
                     max(14px, env(safe-area-inset-right))
                     max(28px, env(safe-area-inset-bottom))
                     max(14px, env(safe-area-inset-left));
            position: relative;
        }

        /* 极淡网格纹理：大面积近黑底会显得"死"，叠一层 2.5% 白网格有纵深又不抢内容 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 38px 38px;
            -webkit-mask-image: radial-gradient(ellipse 120% 80% at 50% 0%, #000 0%, transparent 78%);
            mask-image: radial-gradient(ellipse 120% 80% at 50% 0%, #000 0%, transparent 78%);
        }

        .container { max-width: 1180px; margin: 0 auto; position: relative; z-index: 1; display: none; }

        /* 登录页 */
        #loginOverlay {
            position: fixed; inset: 0; background: transparent; z-index: 999;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }

        /* 卡片 & 元素 */
        .card {
            background: var(--card-bg); backdrop-filter: blur(24px) saturate(1.2); -webkit-backdrop-filter: blur(24px) saturate(1.2);
            border-radius: 28px; padding: 28px 22px; box-shadow: var(--card-inner-glow), var(--card-shadow);
            margin-bottom: 20px; border: 1px solid var(--card-border); position: relative; overflow: hidden;
            transition: all 0.4s;
        }
        .card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: var(--gradient-primary); opacity: 0.6; border-radius: 28px 28px 0 0;
        }

        .header { text-align: center; margin-bottom: 24px; }
        .header h1 { font-size: 1.6rem; font-weight: 900; }
        .header h1 .accent { background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        input[type="password"], select {
            width: 100%; padding: 14px 18px; border-radius: 18px; border: 1.5px solid var(--border-soft);
            background: var(--input-bg); color: var(--text-primary); font-size: 0.95rem; outline: none; transition: 0.25s;
        }
        select {
            appearance: none; cursor: pointer; padding-right: 44px; font-weight: 500;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23FF7EB3' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat; background-position: right 14px center; background-size: 16px;
        }
        input[type="password"]:focus, select:focus { border-color: var(--accent-pink); box-shadow: 0 0 0 4px var(--accent-pink-glow); }
        [data-theme="dark"] select { background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23FF8FBF' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); }

        .btn {
            border: none; padding: 14px; border-radius: 16px; font-weight: 700; cursor: pointer;
            font-size: 0.9rem; width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px;
            letter-spacing: 1px; font-family: inherit;
            /* 与点饭页主按钮一致：半透明粉底 + 描边 + 大范围柔光，而不是实心渐变块 */
            background: rgba(255, 145, 189, 0.1); color: #fff;
            border: 1px solid rgba(255, 145, 189, 0.4);
            box-shadow: 0 0 30px rgba(255, 145, 189, 0.12);
            transition: background 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, transform 0.12s ease;
        }
        .btn:hover:not(:disabled) { background: rgba(255, 145, 189, 0.17); box-shadow: 0 0 30px rgba(255, 145, 189, 0.25); }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.55; cursor: not-allowed; }
        .btn-danger {
            background: transparent; color: var(--accent-pink);
            border: 1px solid var(--border-medium); box-shadow: none;
        }
        .btn-danger:hover:not(:disabled) { background: rgba(255, 145, 189, 0.14); }

        .btn-copy {
            background: var(--gradient-badge); color: var(--text-primary); font-size: 0.78rem; padding: 8px 16px;
            border-radius: 50px; border: 1px solid var(--border-soft); font-weight: 600; cursor: pointer;
            display: flex; align-items: center; gap: 5px; transition: 0.25s;
        }
        .btn-copy:hover { transform: translateY(-2px) scale(1.04); border-color: var(--accent-purple); }
        .btn-copy svg { stroke: var(--accent-purple); }

        /* Dashboard 数据网格 */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .stat-card {
            background: var(--card-bg); border-radius: 20px; padding: 20px; text-align: center;
            border: 1px solid var(--card-border); box-shadow: var(--card-shadow);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
        }
        .stat-value { font-size: 1.8rem; font-weight: 900; color: var(--accent-pink-deep); line-height: 1.2; }
        .stat-label { font-size: 0.8rem; color: var(--text-secondary); font-weight: 600; }

        /* 表格排版 */
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .section-title { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 0.95rem; color: var(--text-primary); }
        .section-icon {
            width: 30px; height: 30px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
            font-size: 0.9rem; border: 1px solid var(--border-soft);
        }
        .section-icon.purple { background: linear-gradient(135deg, rgba(176,136,249,0.12), rgba(176,136,249,0.05)); }
        .section-icon.mint { background: linear-gradient(135deg, rgba(111,212,181,0.12), rgba(111,212,181,0.05)); }

        table { width: 100%; border-collapse: separate; border-spacing: 0 6px; }
        th { text-align: left; padding: 8px 12px; color: var(--text-tertiary); font-size: 0.72rem; font-weight: 700; letter-spacing: 1px; }
        td { padding: 12px; font-size: 0.88rem; font-weight: 600; background: var(--table-row-bg); }
        tr td:first-child { border-radius: 14px 0 0 14px; }
        tr td:last-child { border-radius: 0 14px 14px 0; }
        .count-badge {
            background: var(--gradient-badge); padding: 3px 12px; border-radius: 20px; font-size: 0.78rem;
            font-weight: 700; color: var(--accent-pink-deep); display: inline-block; border: 1px solid var(--border-soft);
        }

        /* 订单行 */
        .order-row {
            display: flex; justify-content: space-between; align-items: center; padding: 14px 16px;
            background: var(--order-row-bg); border-radius: 18px; margin-bottom: 8px; border: 1px solid transparent;
        }
        .order-main { display: flex; flex-direction: column; gap: 4px; }
        .order-name { font-weight: 700; display: flex; align-items: center; gap: 8px; font-size: 0.92rem; }
        .tag { background: var(--surface-tag); color: var(--accent-pink-deep); padding: 3px 10px; border-radius: 10px; font-size: 0.72rem; font-weight: 700; border: 1px solid var(--border-soft); }
        .order-time { font-size: 0.75rem; color: var(--text-tertiary); display: flex; align-items: center; gap: 4px; }
        .order-right { display: flex; align-items: center; gap: 12px; }

        .btn-delete {
            background: var(--danger-bg); width: 32px; height: 32px; border-radius: 11px; border: 1px solid var(--border-soft);
            cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s;
        }
        .btn-delete svg { stroke: var(--accent-pink-deep); transition: stroke 0.3s; }
        .btn-delete:hover { background: var(--accent-pink-deep); border-color: var(--accent-pink-deep); transform: rotate(90deg) scale(1.1); }
        .btn-delete:hover svg { stroke: white; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; margin-top: 10px; }
        .form-row .btn { padding: 0 20px; border-radius: 18px; }

        /* ============ 定时设置 ============ */
        .status-pill {
            font-size: 0.72rem; font-weight: 700; padding: 3px 11px; border-radius: 50px;
            border: 1px solid var(--border-soft); background: var(--surface-light); color: var(--text-secondary);
            white-space: nowrap;
        }
        .status-pill.is-open { color: #4DC9A4; border-color: rgba(77,201,164,0.4); background: rgba(77,201,164,0.1); }
        .status-pill.is-closed { color: var(--accent-pink-deep); border-color: rgba(255,92,141,0.4); background: rgba(255,92,141,0.1); }

        .switch-row {
            display: flex; align-items: center; gap: 9px;
            font-size: 0.82rem; font-weight: 600; color: var(--text-primary);
            padding: 9px 0; cursor: pointer;
        }
        .switch-row input[type="checkbox"] {
            width: 18px; height: 18px; accent-color: var(--accent-pink-deep); cursor: pointer; flex-shrink: 0;
        }

        .time-row {
            display: flex; align-items: flex-end; gap: 10px; margin-top: 4px;
        }
        .time-row > div { flex: 1; }
        .time-row input[type="time"] {
            width: 100%; padding: 11px 12px; border-radius: 14px; border: 1.5px solid var(--border-soft);
            background: var(--input-bg); color: var(--text-primary); font-size: 16px; font-weight: 600;
            font-family: inherit; outline: none;
        }
        .time-row input[type="time"]:focus { border-color: var(--accent-pink); box-shadow: 0 0 0 3px var(--accent-pink-glow); }
        .time-sep { flex: 0 0 auto; padding-bottom: 12px; color: var(--text-tertiary); font-weight: 700; }

        .mini-label { display: block; font-size: 0.72rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 5px; }
        .tiny-hint { font-size: 0.7rem; color: var(--text-tertiary); margin-top: 7px; line-height: 1.6; }
        .tiny-hint b { color: var(--accent-pink); font-weight: 700; }

        /* 只读展示框：和输入框同高，视觉上对齐 */
        .readout {
            padding: 11px 12px; border-radius: 14px; border: 1px dashed var(--border-soft);
            background: var(--surface-light); color: var(--text-primary);
            font-size: 0.85rem; font-weight: 600; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
        }

        /* ============ 多时段编辑器 ============ */
        .window-list { display: flex; flex-direction: column; gap: 8px; }
        .window-row {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 10px; border-radius: 14px;
            background: var(--surface-light); border: 1px solid var(--border-soft);
        }
        .window-row .widx {
            font-size: 0.7rem; font-weight: 700; color: var(--text-tertiary);
            flex: 0 0 26px;
        }
        .window-row input[type="time"] {
            flex: 1; min-width: 0; padding: 9px 10px; border-radius: 11px;
            border: 1px solid var(--border-soft); background: var(--input-bg);
            color: var(--text-primary); font-size: 16px; font-weight: 600;
            font-family: inherit; outline: none;
        }
        .window-row input[type="time"]:focus {
            border-color: var(--accent-pink); box-shadow: 0 0 0 3px var(--accent-pink-glow);
        }
        .window-row .wsep { color: var(--text-tertiary); font-weight: 700; flex-shrink: 0; }
        .window-row .wdel {
            flex: 0 0 auto; width: 30px; height: 30px; border-radius: 9px;
            border: 1px solid var(--border-soft); background: transparent;
            color: var(--text-tertiary); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .window-row .wdel:hover { background: var(--accent-pink-deep); color: #fff; border-color: var(--accent-pink-deep); }
        .window-empty {
            font-size: 0.78rem; color: var(--text-tertiary); text-align: center;
            padding: 14px; border: 1px dashed var(--border-soft); border-radius: 14px;
        }

        /* 缺勤名单 */
        .miss-list { display: flex; flex-wrap: wrap; gap: 7px; }
        .miss-chip {
            padding: 5px 12px; border-radius: 50px; font-size: 0.8rem; font-weight: 600;
            background: rgba(255, 145, 189, 0.09); border: 1px solid var(--border-medium);
            color: var(--accent-pink);
        }
        .miss-none { font-size: 0.82rem; color: var(--text-secondary); padding: 6px 0; }

        /* ============ 帮点一下：可折叠餐品卡片 ============ */
        /* 与点饭页的菜单 deck 同一套交互：默认只露前若干个，点按钮展开全部 */
        .deck-toggle {
            display: inline-flex; align-items: center; gap: 4px;
            background: var(--surface-light); color: var(--text-secondary);
            border: 1px solid var(--border-soft); border-radius: 50px;
            padding: 5px 11px; font-size: 0.75rem; font-weight: 600;
            cursor: pointer; font-family: inherit; flex-shrink: 0;
            transition: border-color 0.2s ease, color 0.2s ease;
        }
        .deck-toggle:hover { border-color: var(--border-medium); color: var(--accent-pink); }
        .deck-toggle:active { transform: scale(0.96); }
        .deck-toggle svg { stroke: currentColor; transition: transform 0.22s ease; flex-shrink: 0; }
        .deck-toggle.is-expanded svg { transform: rotate(180deg); }

        .food-grid {
            display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;
        }
        .food-item {
            position: relative; display: flex; flex-direction: column;
            align-items: center; gap: 2px; text-align: center;
            padding: 12px 8px 10px; border-radius: 14px;
            border: 1px solid var(--border-soft); background: var(--surface-light);
            cursor: pointer; user-select: none; font-family: inherit;
            transition: border-color 0.18s ease, background 0.18s ease,
                        box-shadow 0.18s ease, transform 0.12s ease;
        }
        .food-item:hover { border-color: var(--border-medium); }
        .food-item:active { transform: scale(0.97); }
        .food-item.active {
            border-color: var(--accent-pink);
            background: rgba(255, 145, 189, 0.12);
            box-shadow: 0 0 0 1px var(--accent-pink), 0 0 18px rgba(255, 145, 189, 0.25);
        }
        .food-item .fi-icon { font-size: 1.5rem; line-height: 1.15; }
        .food-item .fi-name { font-size: 0.82rem; font-weight: 600; color: var(--text-primary); }
        .food-item .fi-price { font-size: 0.7rem; font-weight: 600; color: var(--text-secondary); }
        .food-item.active .fi-price { color: var(--accent-pink); }
        /* 被点次数角标 */
        .food-item .fi-count {
            position: absolute; top: 5px; left: 5px;
            padding: 1px 5px; border-radius: 20px; font-size: 0.58rem; font-weight: 700;
            background: rgba(255, 226, 154, 0.16); color: var(--gold);
            border: 1px solid rgba(255, 226, 154, 0.3);
        }
        .food-item .fi-count:empty { display: none; }
        /* 折叠态隐藏：必须带 .is-collapsed 限定。
           少了它标记会永久生效，展开后卡片也回不来。 */
        .food-grid.is-collapsed .food-item.is-hidden { display: none; }
        .food-grid.is-closed .food-item { opacity: 0.45; pointer-events: none; }

        .picked-hint { font-weight: 500; color: var(--accent-pink); margin-left: 6px; }

        /* ============ 帮点一下：名字平铺 ============ */
        /* 9 个人一屏放得下，不需要折叠；一眼看全比下拉快 */
        .name-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 7px;
        }
        .name-item {
            position: relative;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 1px; min-height: 48px; padding: 7px 4px;
            border-radius: 13px; border: 1px solid var(--border-soft);
            background: var(--surface-light); color: var(--text-primary);
            font-size: 0.95rem; font-weight: 700; font-family: inherit;
            cursor: pointer; user-select: none;
            transition: border-color 0.18s ease, background 0.18s ease,
                        box-shadow 0.18s ease, transform 0.12s ease;
        }
        .name-item:hover:not(:disabled) { border-color: var(--border-medium); }
        .name-item:active:not(:disabled) { transform: scale(0.95); }
        .name-item.active {
            background: rgba(255, 145, 189, 0.14);
            border-color: var(--accent-pink);
            box-shadow: 0 0 0 1px var(--accent-pink), 0 0 16px rgba(255, 145, 189, 0.25);
        }
        .name-item.active::after {
            content: '✓'; position: absolute; top: 3px; right: 5px;
            font-size: 0.6rem; color: var(--accent-pink);
        }
        /* 他点的餐品，直接显示在名字下面 */
        .name-item .ni-food {
            font-size: 0.6rem; font-weight: 500; color: var(--accent-pink);
            max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        /* 已经点过的人：置灰不可选，避免重复下单 */
        .name-item.taken {
            cursor: not-allowed; opacity: 0.5;
            background: #ffffff05; border-color: transparent;
        }
        .name-item.taken .ni-name {
            color: var(--text-tertiary); text-decoration: line-through;
            text-decoration-color: var(--text-tertiary);
        }
        .name-item.taken::before {
            content: ''; position: absolute; top: 5px; right: 5px;
            width: 4px; height: 4px; border-radius: 50%;
            background: var(--accent-pink); box-shadow: 0 0 6px var(--accent-pink-glow);
        }
        .name-item.taken:active { transform: none; }

        /* 报单表格里的「图标 + 菜名」 */
        .cell-food { display: inline-flex; align-items: center; gap: 7px; }

        .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
        .btn-row .btn { flex: 1 1 auto; min-width: 108px; padding: 11px 14px; font-size: 0.8rem; }

        /* Toast & 杂项 */
        #toast {
            position: fixed; top: max(env(safe-area-inset-top, 16px), 16px); left: 50%;
            transform: translateX(-50%) translateY(-14px);
            padding: 11px 20px; border-radius: 50px; font-size: 0.82rem; font-weight: 600;
            max-width: calc(100vw - 32px); text-align: center;
            z-index: 1000; opacity: 0; visibility: hidden;
            transition: opacity 0.22s ease, transform 0.22s ease, visibility 0.22s;
            /* 旧版只设了 color: white，没有背景 —— 白字直接叠在页面上，几乎看不见 */
            background: var(--toast-bg); color: var(--toast-fg);
            border: 1px solid var(--toast-border);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
        }
        #toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
        #toast.error {
            background: var(--toast-error-bg); color: var(--toast-error-fg);
            border-color: var(--toast-error-border);
        }

        /* 键盘可达性 */
        :focus-visible { outline: 2px solid var(--accent-purple); outline-offset: 2px; }

        /* 滚动条 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
        ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 10px; }

        /* ============================================================
           响应式：旧版一个媒体查询都没有，手机上表格会横向挤爆
           ============================================================ */
        @media (max-width: 560px) {
            .container { max-width: 100%; }
            .card { padding: 16px 14px; border-radius: 16px; }
            .form-row { grid-template-columns: 1fr; }
            .form-row .btn { width: 100%; padding: 12px; }
            .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
            .stat-value { font-size: 1.35rem; }
            .btn-row .btn { min-width: 0; flex: 1 1 100%; }

            /* 窄屏把报单表格改成卡片式，避免横向滚动 */
            .stack-table thead { display: none; }
            .stack-table, .stack-table tbody, .stack-table tr, .stack-table td { display: block; width: 100%; }
            .stack-table tr {
                background: var(--table-row-bg); border-radius: 12px;
                margin-bottom: 6px; padding: 8px 12px;
            }
            .stack-table td {
                background: none; padding: 3px 0; display: flex;
                justify-content: space-between; gap: 10px;
            }
            .stack-table td::before {
                content: attr(data-label); color: var(--text-tertiary);
                font-size: 0.72rem; font-weight: 500;
            }
            .stack-table td:first-child { border-radius: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

<div id="toast" role="status" aria-live="polite"></div>

<!-- 鉴权遮罩 -->
<div id="loginOverlay">
    <div class="card" style="width: 100%; max-width: 340px; margin: 0;">
        <div class="header" style="margin-bottom: 20px;">
            <h1>后台<span class="accent">鉴权</span></h1>
        </div>
        <input type="password" id="pwdInput" placeholder="输入管理员密码..." style="margin-bottom: 16px;" onkeydown="if(event.key==='Enter') doLogin()">
        <button class="btn" onclick="doLogin()">进入控制台</button>
    </div>
</div>

<div class="container" id="adminDashboard">

    <!-- 顶栏状态 -->
    <div class="header">

    <!-- 数据看板 -->
    <div class="stats-grid">

    <!-- 商家报单 -->
    <div class="card">
        <div class="section-header">

            </div>
            <button class="btn-copy" onclick="copyMerchantOrder()">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>

    <!-- 代客补单 -->
    <div class="card">
        <div class="section-header" style="margin-bottom: 5px;">
            <div class="section-title">
                <span class="section-icon mint">✍️</span>
                帮点一下
            </div>
            <button class="deck-toggle" id="manualDeckToggle" type="button"
                    aria-expanded="false" aria-controls="manualFoodGrid">
                <span id="manualDeckToggleText">全部 13 项</span>
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </button>
        </div>

        <!-- 名字：全部平铺展示，不用下拉。
             9 个人一屏放得下，一眼看全、单击即选，也顺便看清谁已经点过。 -->
        <div class="field">
            <label class="mini-label">名字<span class="picked-hint" id="manualNamePicked"></span></label>
            <div class="name-grid" id="manualNameGrid" role="group" aria-label="选择名字"></div>
        </div>

        <!-- 餐品改成可折叠卡片：默认只露 4 个，避免一屏全是选项 -->
        <div class="field" style="margin-bottom:0;">
            <label class="mini-label">餐品<span class="picked-hint" id="manualPicked"></span></label>
            <div class="food-grid is-collapsed" id="manualFoodGrid" role="group" aria-label="选择餐品"></div>
        </div>

        <button class="btn btn-primary" id="manualSubmitBtn" type="button" style="margin-top:14px;">添加</button>

    <!-- 定时设置 -->
    <div class="card">
        <div class="section-header">

        <label class="switch-row">

        <!-- 多时段：一天可设多组，任一段内都可点单 -->
        <div id="windowList" class="window-list"></div>
        <button class="btn btn-ghost btn-sm" id="addWindowBtn" type="button" style="margin-top:8px;">+ 添加时间段</button>
        <p class="tiny-hint">
            可设多组，例如早饭 <b>06:00–09:00</b> + 午饭 <b>10:00–11:00</b>，任一段内都能点单。
            支持跨零点（如 22:00–02:00）。起止填相同表示全天开放。
        </p>

        <div class="field" style="margin-top:12px;">
            <label class="mini-label" for="closedMessage">封盘时页面上显示</label>
            <input type="text" id="closedMessage" maxlength="60" placeholder="今天点单已结束">
        </div>

        <label class="switch-row" style="margin-top:10px;">

            <span>清空时保留历史（用于周统计与对账）</span>

        <label class="switch-row" style="margin-top:2px;">

        <div class="time-row" style="margin-top:2px;">
            <div>
                <label class="mini-label" for="resetTime">清空时刻</label>

            <div class="time-sep"></div>
            <div style="flex:2;">
                <label class="mini-label">下一次清空</label>
                <div class="readout" id="nextResetAt">—</div>
            </div>
        </div>
        <p class="tiny-hint">
            到点后由<b>第一个打开页面的人</b>触发清空，因此不需要在 Cloudflare 配定时任务。
            把「清空时刻」设成 03:00，就等价于每天凌晨 3 点清。
        </p>

        <div class="btn-row">
            <button class="btn btn-primary" id="saveScheduleBtn" type="button">保存设置</button>
            <button class="btn btn-ghost" id="startNewDayBtn" type="button">开始新一天</button>
            <button class="btn btn-ghost" id="clearNowBtn" type="button">只清空订单</button>
        </div>
    </div>

    <!-- 订单明细 -->
    <div class="card">
        <div class="section-header">
            <div class="section-title">
                <span class="section-icon purple">📋</span>
                订单明细
            </div>
            <button class="btn-copy" onclick="exportCSV()">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                导出表格
            </button>
        </div>
        <div id="detailedList">
            <div style="text-align: center; padding: 20px; color: var(--text-tertiary);">加载中...</div>
        </div>
    </div>

    <!-- 缺勤名单：发群里催人 -->
    <div class="card">
        <div class="section-header">
            <div class="section-title">
                <span class="section-icon">📣</span>
                还没点的人
            </div>
            <button class="btn-copy" id="copyMissingBtn" type="button">复制催单</button>
        </div>
        <div id="missingBox"></div>
    </div>

    <!-- 周统计：谁点了几次、该给多少钱 -->
    <div class="card">
        <div class="section-header">
            <div class="section-title">
                <span class="section-icon">📈</span>
                近期统计
            </div>
            <select id="statsDays" style="width:auto;padding:7px 30px 7px 10px;font-size:13px;">
                <option value="1">今天</option>
                <option value="7" selected>近 7 天</option>
                <option value="30">近 30 天</option>
            </select>
        </div>
        <div class="table-wrap">
            <table class="stack-table">
                <thead><tr><th>成员</th><th>次数</th><th class="num">应付</th></tr></thead>
                <tbody id="statsList"></tbody>
            </table>
        </div>
    </div>

    <!-- 危险操作 -->
    <div class="card" style="border-color: var(--border-soft);">
        <button class="btn btn-danger" onclick="forceClearAll()">⚠️ 清空所有数据</button>
    </div>

</div>

<script>
    /* =========================================================
       Admin Console v2
       - State 集中管理
       - API 请求统一封装
       - Render 纯渲染
       - Action 统一处理
       - 自动刷新可控、避免重复请求
       ========================================================= */

    const CONFIG = Object.freeze({
        API_URL: 'https://api.yukiom.us.ci/',
        REFRESH_INTERVAL: 15000,
        NAMES: Object.freeze(['周', '陈', '袁', '范', '祝', '何', '黄', '宋', '朱']),
        /*
         * 必须与点饭页 (main (2).html) 的 MENU 同序同名同价。
         * 这里原先缺 icon 字段、顺序也不同 —— 结果「帮点一下」的卡片
         * 拿不到 icon 全部退化成同一个 emoji，看着像图挂了。
         */
        MENU: Object.freeze([
            { name: '饭', price: 6, icon: '🍛' },
            { name: '汤粉', price: 5, icon: '🍲' },
            { name: '炒饭', price: 6, icon: '🍚' },
            { name: '炒粉', price: 7, icon: '🍜' },
            { name: '炒河粉', price: 6, icon: '🍝' },
            { name: '面', price: 5, icon: '🍜' },
            { name: '面+蛋', price: 6, icon: '🍜' },
            { name: '汤粉+蛋', price: 6, icon: '🍲' },
            { name: '白饭', price: 2, icon: '🍚' },
            { name: '拌面', price: 6, icon: '🍜' },
            { name: '拌粉', price: 6, icon: '🍜' },
            { name: '水饺', price: 6, icon: '🥟' },
            { name: '混沌', price: 6, icon: '🍜' }
        ])
    });

    const state = {
        orders: [],
        loading: false,
        initialized: false,
        refreshTimer: null,
        requestId: 0,
        schedule: null,     // 服务端当前的定时状态（含缺勤名单）
        stats: null,        // 最近 N 天的统计
        manualFoodIdx: null, // 「帮点一下」里选中的餐品下标
        manualName: null     // 「帮点一下」里选中的名字
    };

    const $ = (id) => document.getElementById(id);

    const storage = {
        getPassword() {
            return sessionStorage.getItem('adminPassword') || '';
        },
        setPassword(value) {
            sessionStorage.setItem('adminPassword', value);
        },
        clearPassword() {
            sessionStorage.removeItem('adminPassword');
        },
        getDeviceToken() {
            let token = localStorage.getItem('deviceToken');
            if (!token) {
                token = crypto?.randomUUID?.() ||
                    `${Math.random().toString(36).slice(2)}${Date.now()}`;
                localStorage.setItem('deviceToken', token);
            }
            return token;
        }
    };

    const session = {
        get password() {
            return storage.getPassword();
        },
        login(password) {
            storage.setPassword(password);
        },
        logout() {
            storage.clearPassword();
            state.orders = [];
            stopAutoRefresh();
            renderAll();
        },
        isAuthenticated() {
            return Boolean(this.password);
        }
    };

    const deviceToken = storage.getDeviceToken();

    /* -------------------- Utilities -------------------- */

    function escapeHtml(value) {
        const div = document.createElement('div');
        div.textContent = value == null ? '' : String(value);
        return div.innerHTML;
    }

    function formatMoney(value) {
        const number = Number(value) || 0;
        return `¥${number.toFixed(0)}`;
    }

    function formatTime(timestamp) {
        if (!timestamp) return '-';

        const date = new Date(timestamp);
        if (Number.isNaN(date.getTime())) return '-';

        return date.toLocaleTimeString('zh-CN', {
            hour: '2-digit',
            minute: '2-digit',
            hour12: false
        });
    }

    function formatDateTime(timestamp) {
        if (!timestamp) return '-';

        const date = new Date(timestamp);
        if (Number.isNaN(date.getTime())) return '-';

        return date.toLocaleString('zh-CN');
    }

    function normalizeOrders(data) {
        if (!Array.isArray(data)) return [];

        return data
            .filter(Boolean)
            .map((order) => ({
                name: String(order.name ?? ''),
                food: String(order.food ?? ''),
                price: Number(order.price) || 0,
                time: Number(order.time) || 0
            }))
            .filter(order => order.name && order.food);
    }

    function getMenuItem(foodName) {
        return CONFIG.MENU.find(item => item.name === foodName) || null;
    }

    function getOrderTotal(orders = state.orders) {
        return orders.reduce((total, order) => total + order.price, 0);
    }

    function getFoodSummary(orders = state.orders) {
        const map = new Map();

        for (const order of orders) {
            const existing = map.get(order.food);

            if (existing) {
                existing.count += 1;
            } else {
                // 带上 icon，报单表格与点饭页的汇总保持一致
                const menu = getMenuItem(order.food);
                map.set(order.food, {
                    food: order.food,
                    count: 1,
                    price: order.price,
                    icon: menu ? menu.icon : ''
                });
            }
        }

        // 顺序跟菜单走：老板看报单时按熟悉的顺序找，比按点单先后更好认
        const order = CONFIG.MENU.map(m => m.name);
        return [...map.values()].sort((a, b) => order.indexOf(a.food) - order.indexOf(b.food));
    }

    function getOrderedNames() {
        return new Set(state.orders.map(order => order.name));
    }

    /* -------------------- Toast -------------------- */

    let toastTimer = null;

    function showToast(message, isError = false) {
        const toast = $('toast');
        if (!toast) return;

        toast.textContent = `${isError ? '⚠️' : '✅'} ${message}`;
        toast.style.background = isError
            ? 'rgba(255, 70, 100, 0.92)'
            : 'rgba(45, 35, 50, 0.92)';

        toast.classList.add('show');

        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }

    /* -------------------- API Layer -------------------- */

    async function apiRequest(path = '', options = {}) {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 10000);

        try {
            const response = await fetch(CONFIG.API_URL + path, {
                ...options,
                signal: controller.signal,
                headers: {
                    ...(options.body ? { 'Content-Type': 'application/json' } : {}),
                    ...(options.headers || {})
                }
            });

            const contentType = response.headers.get('content-type') || '';
            const data = contentType.includes('application/json')
                ? await response.json()
                : await response.text();

            if (!response.ok) {
                const error = new Error(
                    typeof data === 'string'
                        ? data || `HTTP ${response.status}`
                        : data?.message || `HTTP ${response.status}`
                );
                error.status = response.status;
                error.data = data;
                throw error;
            }

            return data;
        } finally {
            clearTimeout(timeout);
        }
    }

    const API = {
        async getOrders() {
            return normalizeOrders(await apiRequest());
        },

        async createOrder({ name, food, price }) {
            return apiRequest('', {
                method: 'POST',
                body: JSON.stringify({
                    name,
                    food,
                    price,
                    time: Date.now(),
                    token: deviceToken
                })
            });
        },

        async deleteOrder(name) {
            return apiRequest('', {
                method: 'DELETE',
                body: JSON.stringify({
                    name,
                    adminPassword: session.password
                })
            });
        },

        async clearOrders() {
            return apiRequest('', {
                method: 'DELETE',
                body: JSON.stringify({
                    adminPassword: session.password
                })
            });
        },

        /* ---- 定时设置 ---- */

        async getSettings() {
            const pwd = encodeURIComponent(session.password);
            return apiRequest(`settings?adminPassword=${pwd}`);
        },

        async updateSettings(patch) {
            return apiRequest('settings', {
                method: 'POST',
                body: JSON.stringify({ action: 'update', adminPassword: session.password, ...patch })
            });
        },

        async clearNowSettings() {
            return apiRequest('settings', {
                method: 'POST',
                body: JSON.stringify({ action: 'clearNow', adminPassword: session.password })
            });
        },

        async startNewDay() {
            return apiRequest('settings', {
                method: 'POST',
                body: JSON.stringify({ action: 'startNewDay', adminPassword: session.password })
            });
        },

        /** 最近 N 天的统计（每人次数与花费） */
        async getStats(days = 7) {
            const pwd = encodeURIComponent(session.password);
            return apiRequest(`stats?days=${days}&adminPassword=${pwd}`);
        }
    };

    /* -------------------- State / Data -------------------- */

    async function fetchData({ silent = false } = {}) {
        if (state.loading) return;

        const currentRequest = ++state.requestId;
        state.loading = true;

        if (!silent) {
            setLoadingState(true);
        }

        try {
            const orders = await API.getOrders();

            // 如果期间又发起了更新请求，丢弃旧请求结果。
            if (currentRequest !== state.requestId) return;

            state.orders = orders;
            renderAll();
        } catch (error) {
            if (!silent) {
                showToast(
                    error.name === 'AbortError'
                        ? '请求超时'
                        : '无法获取订单数据',
                    true
                );
            }
            console.error('[Admin] fetchData:', error);
        } finally {
            if (currentRequest === state.requestId) {
                state.loading = false;
                setLoadingState(false);
            }
        }
    }

    function setLoadingState(isLoading) {
        // 按钮改成 id 定位（原来是按内联 onclick 选择器找的，那时「添加」用 onclick 绑定）
        const button = $('manualSubmitBtn');
        if (!button) return;

        button.disabled = isLoading;
        button.textContent = isLoading ? '同步中…' : '添加';
    }

    function startAutoRefresh() {
        stopAutoRefresh();

        state.refreshTimer = setInterval(() => {
            if (session.isAuthenticated() && !document.hidden) {
                fetchData({ silent: true });
            }
        }, CONFIG.REFRESH_INTERVAL);
    }

    function stopAutoRefresh() {
        if (state.refreshTimer) {
            clearInterval(state.refreshTimer);
            state.refreshTimer = null;
        }
    }

    /* -------------------- 定时设置 -------------------- */

    /** 当前编辑器里的时间段（[{start,end}]），供保存时读取 */
    function readWindows() {
        return [...document.querySelectorAll('#windowList .window-row')].map(row => ({
            start: row.querySelector('[data-role="start"]').value,
            end: row.querySelector('[data-role="end"]').value
        }));
    }

    /** 画一个时间段输入行 */
    function renderWindowRow(win, index) {
        const row = document.createElement('div');
        row.className = 'window-row';
        row.innerHTML = `
            <span class="widx">${index + 1}</span>
            <input type="time" data-role="start" value="${escapeHtml(win.start || '06:00')}"
                   aria-label="第 ${index + 1} 个时间段开始时间">
            <span class="wsep">–</span>
            <input type="time" data-role="end" value="${escapeHtml(win.end || '10:30')}"
                   aria-label="第 ${index + 1} 个时间段结束时间">
            <button class="wdel" type="button" data-role="del"
                    aria-label="删除第 ${index + 1} 个时间段">✕</button>`;
        return row;
    }

    function renderWindowList(windows) {
        const box = $('windowList');
        box.innerHTML = '';

        if (!windows.length) {
            box.innerHTML = '<div class="window-empty">还没有时间段，添加一个才能限制点单时间</div>';
            return;
        }
        windows.forEach((w, i) => box.appendChild(renderWindowRow(w, i)));
    }

    function addWindow() {
        const box = $('windowList');
        // 空状态占位要先清掉
        const empty = box.querySelector('.window-empty');
        if (empty) empty.remove();

        const n = box.querySelectorAll('.window-row').length;
        // 新增时给一个不重叠的默认值，省得手动改两个框
        const defaults = [
            { start: '06:00', end: '09:00' },
            { start: '10:00', end: '11:00' },
            { start: '17:00', end: '18:00' }
        ];
        box.appendChild(renderWindowRow(defaults[n % defaults.length], n));
    }

    /** 把服务端状态画到面板上 */
    function renderSchedule() {
        const s = state.schedule;
        if (!s) return;

        $('scheduleEnabled').checked = !!s.enabled;
        $('autoDailyReset').checked = !!s.autoDailyReset;
        $('keepHistory').checked = s.keepHistory !== false;
        $('closedMessage').value = s.message || '';

        // 多时段：服务端没给 windows 时，用单窗口字段兜一个
        const windows = Array.isArray(s.windows) && s.windows.length
            ? s.windows
            : [{ start: s.openTime || '06:00', end: s.closeTime || '10:30' }];
        renderWindowList(windows);

        // 清空时刻 + 下一次清空的时间点
        $('resetTime').value = s.resetTime || '06:00';
        const next = s.nextResetAt ? new Date(s.nextResetAt) : null;
        $('nextResetAt').textContent = !s.autoDailyReset
            ? '已关闭自动清空'
            : (next
                ? `${next.getMonth() + 1}/${next.getDate()} ${String(next.getHours()).padStart(2, '0')}:${String(next.getMinutes()).padStart(2, '0')}`
                : '—');

        // 关掉自动清空后，清空时刻没有意义
        $('resetTime').disabled = !s.autoDailyReset;

        const pill = $('scheduleStatus');
        if (!s.enabled) {
            pill.textContent = '未启用时段限制';
            pill.className = 'status-pill';
        } else if (s.open) {
            pill.textContent = '开放中';
            pill.className = 'status-pill is-open';
        } else {
            pill.textContent = '已封盘';
            pill.className = 'status-pill is-closed';
        }

        // 未启用时段时，时间段输入没有意义，置灰以示区分
        document.querySelectorAll('#windowList input, #addWindowBtn').forEach(el => {
            el.disabled = !s.enabled;
        });

        // 缺勤名单随响应头一起回来，和设置同一份数据
        renderMissing();
    }

    async function fetchSettings() {
        try {
            const data = await API.getSettings();
            state.schedule = data.state || null;
            renderSchedule();

            // 服务端返回的 settings 与 state 合并后回填输入框，
            // 保证用户看到的是「服务器上真正生效的值」而不是本地改动
            if (data.settings) {
                state.schedule = { ...data.settings, ...data.state };
                renderSchedule();
            }
        } catch (error) {
            if (error?.status === 403 || error?.status === 401) {
                handleAuthError(error);
                return;
            }
            // 后端还没更新到支持 /settings 时，这里会 404/405 —— 提示一次即可
            $('scheduleStatus').textContent = '读取失败';
            $('scheduleStatus').className = 'status-pill is-closed';
            console.error('[Admin] fetchSettings:', error);
        }
    }

    async function saveSchedule() {
        const btn = $('saveScheduleBtn');
        const windows = readWindows();

        // 前端先挡一道：空时间段的给出明确提示，而不是让后端报序号
        if ($('scheduleEnabled').checked && !windows.length) {
            return showToast('启用时段限制时至少要有一个时间段', 'error');
        }
        const badIdx = windows.findIndex(w => !w.start || !w.end);
        if (badIdx >= 0) return showToast(`第 ${badIdx + 1} 个时间段没填完整`, 'error');

        btn.disabled = true;
        btn.textContent = '保存中…';

        try {
            const res = await API.updateSettings({
                scheduleEnabled: $('scheduleEnabled').checked,
                autoDailyReset: $('autoDailyReset').checked,
                keepHistory: $('keepHistory').checked,
                windows,
                // 单窗口字段一并写，保持与旧版后端/前端的兼容
                openTime: windows[0] ? windows[0].start : '06:00',
                closeTime: windows[0] ? windows[0].end : '10:30',
                resetTime: $('resetTime').value,
                closedMessage: $('closedMessage').value
            });
            showToast(res.message || '设置已保存');
            await fetchSettings();
            await fetchStats();
        } catch (error) {
            if (!handleAuthError(error)) showToast(error.message || '保存失败', 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = '保存设置';
        }
    }

    async function startNewDay() {
        if (!confirm('清空当前订单并记为「今天」？通常用于手动开启新一天的点单。')) return;
        try {
            const res = await API.startNewDay();
            showToast(res.message || '已开始新一天');
            await fetchData();
            await fetchSettings();
            await fetchStats();
        } catch (error) {
            if (!handleAuthError(error)) showToast(error.message || '操作失败', 'error');
        }
    }

    async function clearOrdersNow() {
        if (!confirm('只清空订单，不改变日期记录。确定继续？')) return;
        try {
            const res = await API.clearNowSettings();
            showToast(res.message || '已清空订单');
            await fetchData();
            await fetchSettings();
            await fetchStats();
        } catch (error) {

        }
    }

    /**

    function renderNameChips() {
        const grid = $('manualNameGrid');
        const ordered = getOrderedNames();
        const sig = CONFIG.NAMES.join('|') + '#' + [...ordered].sort().join(',');

        if (grid.dataset.sig !== sig || !grid.children.length) {
            grid.dataset.sig = sig;
            grid.innerHTML = '';

                const el = document.createElement('button');

                el.className = 'name-item';

                grid.appendChild(el);
            });

        syncNameChipState();

    function syncNameChipState() {
        const ordered = new Map(state.orders.map(o => [o.name, o]));

        $('manualNameGrid').querySelectorAll('.name-item').forEach(el => {
            const name = el.dataset.name;
            const order = ordered.get(name);
            const on = state.manualName === name;
            const taken = !!order;

            el.classList.toggle('active', on && !taken);
            el.classList.toggle('taken', taken);
            // 已点过的人不可选，避免重复下单（后端也会拒）
            el.disabled = taken;
            el.setAttribute('aria-pressed', (on && !taken) ? 'true' : 'false');
            el.setAttribute('aria-label', taken
                ? `${name}，已点${order.food}，不可选择`
                : (on ? `${name}，已选择` : `选择 ${name}`));

            const food = el.querySelector('.ni-food');
            const next = taken ? order.food : '';
            if (food && food.textContent !== next) food.textContent = next;
        });

        $('manualNamePicked').textContent = state.manualName ? `已选：${state.manualName}` : '';
    }

    function selectManualName(name) {
        // 再点一次取消，和餐品卡片一致
        state.manualName = (state.manualName === name) ? null : name;
        syncNameChipState();

    /** 折叠态露出几个（2 列 × 2 行） */
    const MANUAL_PREVIEW = 4;

    /**
     * 渲染餐品卡片。
     * 只在首次或餐品集合变化时建节点；「已点 N 次」角标每轮单独同步，
     * 这样轮询刷新不会把整片卡片重建一遍。
     */
    function renderFoodCards() {
        const grid = $('manualFoodGrid');
        const sig = CONFIG.MENU.map(m => m.name).join('|');

        if (grid.dataset.sig !== sig || !grid.children.length) {
            grid.dataset.sig = sig;
            grid.innerHTML = '';
            CONFIG.MENU.forEach((item, i) => {
                const el = document.createElement('button');
                el.type = 'button';
                el.className = 'food-item';
                el.dataset.idx = String(i);
                el.setAttribute('aria-pressed', 'false');
                el.innerHTML = `
                    <span class="fi-count" aria-hidden="true"></span>
                    <span class="fi-icon" aria-hidden="true">${item.icon}</span>
                    <span class="fi-name">${escapeHtml(item.name)}</span>
                    <span class="fi-price">${formatMoney(item.price)}</span>`;
                grid.appendChild(el);
            });
        }

        syncFoodCardState();
    }

    /** 同步选中态与「已点 N 次」角标 */
    function syncFoodCardState() {
        const counts = new Map();
        state.orders.forEach(o => counts.set(o.food, (counts.get(o.food) || 0) + 1));

        $('manualFoodGrid').querySelectorAll('.food-item').forEach(el => {
            const item = CONFIG.MENU[Number(el.dataset.idx)];
            if (!item) return;

            const on = state.manualFoodIdx === Number(el.dataset.idx);
            el.classList.toggle('active', on);
            el.setAttribute('aria-pressed', on ? 'true' : 'false');

            const n = counts.get(item.name) || 0;
            const badge = el.querySelector('.fi-count');
            const next = n > 0 ? `已点 ${n}` : '';
            if (badge && badge.textContent !== next) badge.textContent = next;
        });

        // 已选中的餐品显示在标签旁边，收起后也能确认选了什么
        const picked = state.manualFoodIdx === null ? null : CONFIG.MENU[state.manualFoodIdx];
        $('manualPicked').textContent = picked ? `已选：${picked.name}` : '';
    }

    /** 折叠态给范围外的卡片打标记（与点饭页同一套做法） */
    function applyDeckCollapsed() {
        const grid = $('manualFoodGrid');
        const collapsed = grid.classList.contains('is-collapsed');

        grid.querySelectorAll('.food-item').forEach((el, i) => {
            el.classList.toggle('is-hidden', collapsed && i >= MANUAL_PREVIEW);
        });

        const btn = $('manualDeckToggle');
        btn.classList.toggle('is-expanded', !collapsed);
        btn.setAttribute('aria-expanded', String(!collapsed));
        $('manualDeckToggleText').textContent = collapsed
            ? `全部 ${CONFIG.MENU.length} 项`
            : '收起';
    }

    function toggleManualDeck() {
        const grid = $('manualFoodGrid');
        grid.classList.toggle('is-collapsed');
        applyDeckCollapsed();
    }

    function selectManualFood(idx) {
        state.manualFoodIdx = (state.manualFoodIdx === idx) ? null : idx;
        syncFoodCardState();
    }

    /* -------------------- Auth -------------------- */

    function renderAuth() {
        const authenticated = session.isAuthenticated();

        $('loginOverlay').style.display = authenticated ? 'none' : 'flex';
        $('adminDashboard').style.display = authenticated ? 'block' : 'none';
    }

    async function doLogin() {
        const input = $('pwdInput');
        const password = input.value.trim();

        if (!password) {
            showToast('请输入密码', true);
            input.focus();
            return;
        }

        /*
         * 这里刻意不在前端比对密码。
         * 旧版写死了 if (password !== '123')，任何人查看源码即可得知密码，
         * 而且改掉 sessionStorage 就能绕过 —— 前端校验不是安全边界。
         * 现在只把密码存下来，由后端在每个请求上验证；错了会在 fetchData 里
         * 收到 403，由 handleAuthError 退回登录页。
         */
        session.login(password);
        input.value = '';

        renderAuth();
        await initApplication();
        await fetchData();
        await fetchSettings();
        await fetchStats();
    }

    function logout() {
        session.logout();
        renderAuth();
        $('pwdInput').value = '';
    }

    function handleAuthError(error) {
        if (error?.status === 401 || error?.status === 403) {
            logout();
            showToast('管理员密码无效，请重新登录', true);
            return true;
        }
        return false;
    }

    /* -------------------- Actions -------------------- */

    async function submitManualOrder() {
        const name = state.manualName;
        // 餐品改为卡片后，选中项记在 state.manualFoodIdx 上
        const food = state.manualFoodIdx === null ? null : CONFIG.MENU[state.manualFoodIdx];

        if (!name) return showToast('请先选名字', true);
        if (!food) return showToast('请先点一个餐品', true);

        // 前端先拦截重复下单，减少无意义请求。
        if (getOrderedNames().has(name)) {
            showToast(`${name} 已经点过了`, true);
            renderManualForm();
            return;
        }

        try {
            setLoadingState(true);

            await API.createOrder({
                name,
                food: food.name,
                price: food.price
            });

            // 重置表单：名字与餐品都清空选中
            state.manualName = null;
            state.manualFoodIdx = null;
            syncNameChipState();
            syncFoodCardState();

            showToast(`已添加 ${name} 的 ${food.name}`);
            await fetchData({ silent: true });
            await fetchStats();
        } catch (error) {
            console.error('[Admin] submitManualOrder:', error);

            if (!handleAuthError(error)) {
                showToast(error.message || '添加失败，请稍后重试', true);
            }
        } finally {
            setLoadingState(false);
        }
    }

    async function forceDeleteOrder(name) {
        if (!name) return;
        if (!confirm(`撤销 ${name} 的订单？`)) return;

        try {
            await API.deleteOrder(name);

            // 立即更新本地 UI，再向服务器同步。
            state.orders = state.orders.filter(order => order.name !== name);
            renderAll();

            showToast(`已撤销 ${name}`);
            await fetchData({ silent: true });
        } catch (error) {
            console.error('[Admin] forceDeleteOrder:', error);

            if (!handleAuthError(error)) {
                showToast('撤销失败，请稍后重试', true);
            }
        }
    }

    async function forceClearAll() {
        if (!state.orders.length) {
            showToast('当前没有订单', true);
            return;
        }

        if (!confirm(`确认清空全部 ${state.orders.length} 份订单？此操作不可恢复。`)) {

        try {
            await API.clearOrders();

            renderAll();

            showToast('已清空全部数据');
            await fetchData({ silent: true });

            console.error('[Admin] forceClearAll:', error);

            if (!handleAuthError(error)) {
                showToast('清空失败，请稍后重试', true);
            }
        }

    /* -------------------- Export / Clipboard -------------------- */

    function buildMerchantText() {
        const summary = getFoodSummary();

        if (!summary.length) return '';

        const count = state.orders.length;
        const total = getOrderTotal();

        const lines = summary.map(item =>
            `${item.food} × ${item.count}份`
        );

        return [
            '老板，今日单：',
            '',
            ...lines,
            '',
            `共计: ${count}份，总价: ${formatMoney(total)}`
        ].join('\n');
    }

    async function copyText(text) {
        if (!text) {
            showToast('暂无数据', true);
            return;
        }

        try {
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(text);
            } else {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.cssText = 'position:fixed;left:-9999px;';
                document.body.appendChild(textarea);
                textarea.select();

                const success = document.execCommand('copy');
                textarea.remove();

                if (!success) throw new Error('clipboard fallback failed');
            }

            showToast('复制成功');
        } catch (error) {
            console.error('[Admin] copy:', error);
            showToast('复制失败，请手动复制', true);
        }
    }

    function copyMerchantOrder() {
        copyText(buildMerchantText());
    }

    function csvCell(value) {
        return `"${String(value ?? '').replace(/"/g, '""')}"`;
    }

    function exportCSV() {
        if (!state.orders.length) {
            showToast('暂无数据', true);
            return;
        }

        const rows = [
            ['姓名', '餐品', '价格', '下单时间'],
            ...[...state.orders]
                .sort((a, b) => b.time - a.time)
                .map(order => [
                    order.name,
                    order.food,
                    `¥${order.price}`,
                    formatDateTime(order.time)
                ])
        ];

        const csv = '\uFEFF' + rows
            .map(row => row.map(csvCell).join(','))
            .join('\r\n');

        const blob = new Blob([csv], {
            type: 'text/csv;charset=utf-8;'
        });

        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');

        link.href = url;
        link.download =
            `点餐明细_${new Date().getMonth() + 1}月${new Date().getDate()}日.csv`;

        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => URL.revokeObjectURL(url), 1000);

        showToast('CSV 导出成功');
    }

    /* -------------------- Events -------------------- */

    function bindEvents() {
        // 保留原有 onclick API，同时增加事件委托，避免给每一行创建大量 handler。
        $('detailedList').addEventListener('click', (event) => {
            const button = event.target.closest('[data-action="delete-order"]');
            if (!button) return;

            forceDeleteOrder(button.dataset.name);
        });

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && session.isAuthenticated()) {
                fetchData({ silent: true });
            }
        });

        window.addEventListener('online', () => {
            if (session.isAuthenticated()) {
                showToast('网络已恢复，正在同步');
                fetchData({ silent: true });
            }
        });

        window.addEventListener('offline', () => {
            showToast('网络连接已断开', true);
        });

        // 定时设置
        $('saveScheduleBtn').addEventListener('click', saveSchedule);
        $('startNewDayBtn').addEventListener('click', startNewDay);
        $('clearNowBtn').addEventListener('click', clearOrdersNow);
        $('addWindowBtn').addEventListener('click', addWindow);

        // 帮点一下：名字与餐品都用事件委托，节点重建后不必重新绑定
        $('manualNameGrid').addEventListener('click', (e) => {
            const chip = e.target.closest('.name-item');
            if (chip && !chip.disabled) selectManualName(chip.dataset.name);
        });
        $('manualNameGrid').addEventListener('keydown', (e) => {
            if (e.key !== 'Enter' && e.key !== ' ') return;
            const chip = e.target.closest('.name-item');
            if (!chip || chip.disabled) return;
            e.preventDefault();
            selectManualName(chip.dataset.name);
        });

        $('manualFoodGrid').addEventListener('click', (e) => {
            const card = e.target.closest('.food-item');
            if (card) selectManualFood(Number(card.dataset.idx));
        });
        $('manualFoodGrid').addEventListener('keydown', (e) => {
            if (e.key !== 'Enter' && e.key !== ' ') return;
            const card = e.target.closest('.food-item');
            if (!card) return;
            e.preventDefault();
            selectManualFood(Number(card.dataset.idx));
        });
        $('manualDeckToggle').addEventListener('click', toggleManualDeck);
        $('manualSubmitBtn').addEventListener('click', submitManualOrder);

        // 时间段行的删除按钮：事件委托，行是动态生成的
        $('windowList').addEventListener('click', (e) => {
            const del = e.target.closest('[data-role="del"]');
            if (!del) return;
            const rows = document.querySelectorAll('#windowList .window-row');
            // 只留一个时不建议删空，但允许 —— 保存时会提示至少要有一个
            del.closest('.window-row').remove();
            if (!document.querySelector('#windowList .window-row')) {
                $('windowList').innerHTML =
                    '<div class="window-empty">还没有时间段，添加一个才能限制点单时间</div>';
            }
            // 重新编号，避免删掉中间一个后序号断档
            document.querySelectorAll('#windowList .window-row').forEach((row, i) => {
                row.querySelector('.widx').textContent = String(i + 1);
            });
        });

        // 统计：切换天数
        $('statsDays').addEventListener('change', fetchStats);
        $('copyMissingBtn').addEventListener('click', copyMissing);

        // 勾选框变化时立即让对应输入框的可用状态跟上
        $('scheduleEnabled').addEventListener('change', (e) => {
            document.querySelectorAll('#windowList input, #addWindowBtn').forEach(el => {
                el.disabled = !e.target.checked;
            });
        });
        $('autoDailyReset').addEventListener('change', (e) => {
            $('resetTime').disabled = !e.target.checked;
            if (!e.target.checked) $('nextResetAt').textContent = '已关闭自动清空';
        });
    }

    /* -------------------- Boot -------------------- */

    async function initApplication() {
        if (state.initialized) {
            startAutoRefresh();
            return;
        }

        state.initialized = true;
        bindEvents();
        renderAll();
        startAutoRefresh();
    }

    async function boot() {
        applyTheme();

        /*
         * 旧版把管理密码写死为 '123' 并存在 sessionStorage 里。
         * 那个键（以及旧的明文密码）不能再被当成已登录凭证使用 —— 清掉，
         * 让所有人重新用服务端校验过的密码登录。
         */
        if (session.password === '123') {
            session.logout();
        }

        renderAuth();

        if (!session.isAuthenticated()) {
            $('pwdInput')?.focus();
            return;
        }

        await initApplication();
        await fetchData();
        await fetchSettings();
        await fetchStats();
    }

    boot();

</script>
</body>
</html>
