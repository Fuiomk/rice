<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>209点饭系统 - 后台</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        /* ============ 完全复用主站主题与变量 ============ */
        /* ============================================================
           配色与点饭页 (main (2).html) 保持一致：近黑底 + 粉/青/金三色霓虹。
           令牌同名同值，改一处两边同步。
           注意：原本这里是浅粉可爱风，与点饭页是两套视觉，这里统一掉。
           ============================================================ */
        :root, [data-theme="light"], [data-theme="dark"] {
            --bg-glow-1: #25142c;
            --bg-glow-2: #0b0711;

            --pink: #ff91bd;
            --cyan: #8deaff;
            --gold: #ffe29a;

            --tri-gradient: linear-gradient(90deg, #ff91bd, #d9a2ff, #ffdf9a);

            --card-bg: #0b0810;
            --card-border: #ffffff10;
            --card-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            --card-shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.65);
            --card-inner-glow: inset 0 1px 0 rgba(255, 255, 255, 0.04);

            --text-primary: #eee;
            --text-secondary: #9d96a4;
            --text-tertiary: #8f8792;

            --accent-pink: #ff91bd;
            --accent-pink-deep: #ff91bd;
            --accent-pink-glow: rgba(255, 145, 189, 0.22);
            --accent-purple: #d9a2ff;
            --accent-purple-deep: #d9a2ff;
            --accent-purple-glow: rgba(217, 162, 255, 0.18);
            --accent-mint: #8deaff;

            --surface-light: #ffffff08;
            --surface-medium: #ffffff0d;
            --surface-tag: #ffffff0a;

            --border-soft: #ffffff10;
            --border-medium: #ff91bd55;

            --gradient-primary: var(--tri-gradient);
            --gradient-badge: rgba(255, 145, 189, 0.12);

            --input-bg: #ffffff08;
            --table-row-bg: #ffffff05;
            --order-row-bg: #ffffff05;
            --order-row-hover: #ffffff0a;

            --divider: #ffffff0d;
            --danger-bg: rgba(255, 145, 189, 0.1);

            --scrollbar-track: transparent;
            --scrollbar-thumb: #ffffff1f;

            --toast-bg: #14101c;
            --toast-fg: #ffffff;
            --toast-border: #ffffff18;
            --toast-error-bg: #2a0f1c;
            --toast-error-fg: #ffb8cf;
            --toast-error-border: rgba(255, 184, 207, 0.25);

            color-scheme: dark;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        * { font-family: 'Noto Sans SC', 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            /* 夜空辉光，与点饭页同一写法 */
            background: radial-gradient(circle at 50% 15%, var(--bg-glow-1) 0, var(--bg-glow-2) 42%, #030308 100%);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            padding: max(18px, env(safe-area-inset-top))
                     max(14px, env(safe-area-inset-right))
                     max(28px, env(safe-area-inset-bottom))
                     max(14px, env(safe-area-inset-left));
            position: relative;
        }

        /* 极淡网格纹理：大面积近黑底会显得"死"，叠一层 2.5% 白网格有纵深又不抢内容 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 38px 38px;
            -webkit-mask-image: radial-gradient(ellipse 120% 80% at 50% 0%, #000 0%, transparent 78%);
            mask-image: radial-gradient(ellipse 120% 80% at 50% 0%, #000 0%, transparent 78%);
        }

        .container { max-width: 1180px; margin: 0 auto; position: relative; z-index: 1; display: none; }

        /* 登录页 */
        #loginOverlay {
            position: fixed; inset: 0; background: transparent; z-index: 999;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }

        /* 卡片 & 元素 */
        .card {
            background: var(--card-bg); backdrop-filter: blur(24px) saturate(1.2); -webkit-backdrop-filter: blur(24px) saturate(1.2);
            border-radius: 28px; padding: 28px 22px; box-shadow: var(--card-inner-glow), var(--card-shadow);
            margin-bottom: 20px; border: 1px solid var(--card-border); position: relative; overflow: hidden;
            transition: all 0.4s;
        }
        .card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: var(--gradient-primary); opacity: 0.6; border-radius: 28px 28px 0 0;
        }

        .header { text-align: center; margin-bottom: 24px; }
        .header h1 { font-size: 1.6rem; font-weight: 900; }
        .header h1 .accent { background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        input[type="password"], select {
            width: 100%; padding: 14px 18px; border-radius: 18px; border: 1.5px solid var(--border-soft);
            background: var(--input-bg); color: var(--text-primary); font-size: 0.95rem; outline: none; transition: 0.25s;
        }
        select {
            appearance: none; cursor: pointer; padding-right: 44px; font-weight: 500;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23FF7EB3' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat; background-position: right 14px center; background-size: 16px;
        }
        input[type="password"]:focus, select:focus { border-color: var(--accent-pink); box-shadow: 0 0 0 4px var(--accent-pink-glow); }
        [data-theme="dark"] select { background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23FF8FBF' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); }

        .btn {
            border: none; padding: 14px; border-radius: 16px; font-weight: 700; cursor: pointer;
            font-size: 0.9rem; width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px;
            letter-spacing: 1px; font-family: inherit;
            /* 与点饭页主按钮一致：半透明粉底 + 描边 + 大范围柔光，而不是实心渐变块 */
            background: rgba(255, 145, 189, 0.1); color: #fff;
            border: 1px solid rgba(255, 145, 189, 0.4);
            box-shadow: 0 0 30px rgba(255, 145, 189, 0.12);
            transition: background 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, transform 0.12s ease;
        }
        .btn:hover:not(:disabled) { background: rgba(255, 145, 189, 0.17); box-shadow: 0 0 30px rgba(255, 145, 189, 0.25); }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.55; cursor: not-allowed; }
        .btn-danger {
            background: transparent; color: var(--accent-pink);
            border: 1px solid var(--border-medium); box-shadow: none;
        }
        .btn-danger:hover:not(:disabled) { background: rgba(255, 145, 189, 0.14); }

        .btn-copy {
            background: var(--gradient-badge); color: var(--text-primary); font-size: 0.78rem; padding: 8px 16px;
            border-radius: 50px; border: 1px solid var(--border-soft); font-weight: 600; cursor: pointer;
            display: flex; align-items: center; gap: 5px; transition: 0.25s;
        }
        .btn-copy:hover { transform: translateY(-2px) scale(1.04); border-color: var(--accent-purple); }
        .btn-copy svg { stroke: var(--accent-purple); }

        /* Dashboard 数据网格 */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .stat-card {
            background: var(--card-bg); border-radius: 20px; padding: 20px; text-align: center;
            border: 1px solid var(--card-border); box-shadow: var(--card-shadow);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
        }
        .stat-value { font-size: 1.8rem; font-weight: 900; color: var(--accent-pink-deep); line-height: 1.2; }
        .stat-label { font-size: 0.8rem; color: var(--text-secondary); font-weight: 600; }

        /* 表格排版 */
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .section-title { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 0.95rem; color: var(--text-primary); }
        .section-icon {
            width: 30px; height: 30px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
            font-size: 0.9rem; border: 1px solid var(--border-soft);
        }
        .section-icon.purple { background: linear-gradient(135deg, rgba(176,136,249,0.12), rgba(176,136,249,0.05)); }
        .section-icon.mint { background: linear-gradient(135deg, rgba(111,212,181,0.12), rgba(111,212,181,0.05)); }

        table { width: 100%; border-collapse: separate; border-spacing: 0 6px; }
        th { text-align: left; padding: 8px 12px; color: var(--text-tertiary); font-size: 0.72rem; font-weight: 700; letter-spacing: 1px; }
        td { padding: 12px; font-size: 0.88rem; font-weight: 600; background: var(--table-row-bg); }
        tr td:first-child { border-radius: 14px 0 0 14px; }
        tr td:last-child { border-radius: 0 14px 14px 0; }
        .count-badge {
            background: var(--gradient-badge); padding: 3px 12px; border-radius: 20px; font-size: 0.78rem;
            font-weight: 700; color: var(--accent-pink-deep); display: inline-block; border: 1px solid var(--border-soft);
        }

        /* 订单行 */
        .order-row {
            display: flex; justify-content: space-between; align-items: center; padding: 14px 16px;
            background: var(--order-row-bg); border-radius: 18px; margin-bottom: 8px; border: 1px solid transparent;
        }
        .order-main { display: flex; flex-direction: column; gap: 4px; }
        .order-name { font-weight: 700; display: flex; align-items: center; gap: 8px; font-size: 0.92rem; }
        .tag { background: var(--surface-tag); color: var(--accent-pink-deep); padding: 3px 10px; border-radius: 10px; font-size: 0.72rem; font-weight: 700; border: 1px solid var(--border-soft); }
        .order-time { font-size: 0.75rem; color: var(--text-tertiary); display: flex; align-items: center; gap: 4px; }
        .order-right { display: flex; align-items: center; gap: 12px; }

        .btn-delete {
            background: var(--danger-bg); width: 32px; height: 32px; border-radius: 11px; border: 1px solid var(--border-soft);
            cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s;
        }
        .btn-delete svg { stroke: var(--accent-pink-deep); transition: stroke 0.3s; }
        .btn-delete:hover { background: var(--accent-pink-deep); border-color: var(--accent-pink-deep); transform: rotate(90deg) scale(1.1); }
        .btn-delete:hover svg { stroke: white; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; margin-top: 10px; }
        .form-row .btn { padding: 0 20px; border-radius: 18px; }

        /* ============ 定时设置 ============ */
        .status-pill {
            font-size: 0.72rem; font-weight: 700; padding: 3px 11px; border-radius: 50px;
            border: 1px solid var(--border-soft); background: var(--surface-light); color: var(--text-secondary);
            white-space: nowrap;
        }
        .status-pill.is-open { color: #4DC9A4; border-color: rgba(77,201,164,0.4); background: rgba(77,201,164,0.1); }
        .status-pill.is-closed { color: var(--accent-pink-deep); border-color: rgba(255,92,141,0.4); background: rgba(255,92,141,0.1); }

        .switch-row {
            display: flex; align-items: center; gap: 9px;
            font-size: 0.82rem; font-weight: 600; color: var(--text-primary);
            padding: 9px 0; cursor: pointer;
        }
        .switch-row input[type="checkbox"] {
            width: 18px; height: 18px; accent-color: var(--accent-pink-deep); cursor: pointer; flex-shrink: 0;
        }

        .time-row {
            display: flex; align-items: flex-end; gap: 10px; margin-top: 4px;
        }
        .time-row > div { flex: 1; }
        .time-row input[type="time"] {
            width: 100%; padding: 11px 12px; border-radius: 14px; border: 1.5px solid var(--border-soft);
            background: var(--input-bg); color: var(--text-primary); font-size: 16px; font-weight: 600;
            font-family: inherit; outline: none;
        }
        .time-row input[type="time"]:focus { border-color: var(--accent-pink); box-shadow: 0 0 0 3px var(--accent-pink-glow); }
        .time-sep { flex: 0 0 auto; padding-bottom: 12px; color: var(--text-tertiary); font-weight: 700; }

        .mini-label { display: block; font-size: 0.72rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 5px; }
        .tiny-hint { font-size: 0.7rem; color: var(--text-tertiary); margin-top: 7px; line-height: 1.6; }

        .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
        .btn-row .btn { flex: 1 1 auto; min-width: 108px; padding: 11px 14px; font-size: 0.8rem; }

        /* Toast & 杂项 */
        #toast {
            position: fixed; top: max(env(safe-area-inset-top, 16px), 16px); left: 50%;
            transform: translateX(-50%) translateY(-14px);
            padding: 11px 20px; border-radius: 50px; font-size: 0.82rem; font-weight: 600;
            max-width: calc(100vw - 32px); text-align: center;
            z-index: 1000; opacity: 0; visibility: hidden;
            transition: opacity 0.22s ease, transform 0.22s ease, visibility 0.22s;
            /* 旧版只设了 color: white，没有背景 —— 白字直接叠在页面上，几乎看不见 */
            background: var(--toast-bg); color: var(--toast-fg);
            border: 1px solid var(--toast-border);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
        }
        #toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
        #toast.error {
            background: var(--toast-error-bg); color: var(--toast-error-fg);
            border-color: var(--toast-error-border);
        }

        /* 键盘可达性 */
        :focus-visible { outline: 2px solid var(--accent-purple); outline-offset: 2px; }

        /* 滚动条 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
        ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 10px; }

        /* ============================================================
           响应式：旧版一个媒体查询都没有，手机上表格会横向挤爆
           ============================================================ */
        @media (max-width: 560px) {
            .container { max-width: 100%; }
            .card { padding: 16px 14px; border-radius: 16px; }
            .form-row { grid-template-columns: 1fr; }
            .form-row .btn { width: 100%; padding: 12px; }
            .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
            .stat-value { font-size: 1.35rem; }
            .btn-row .btn { min-width: 0; flex: 1 1 100%; }

            /* 窄屏把报单表格改成卡片式，避免横向滚动 */
            .stack-table thead { display: none; }
            .stack-table, .stack-table tbody, .stack-table tr, .stack-table td { display: block; width: 100%; }
            .stack-table tr {
                background: var(--table-row-bg); border-radius: 12px;
                margin-bottom: 6px; padding: 8px 12px;
            }
            .stack-table td {
                background: none; padding: 3px 0; display: flex;
                justify-content: space-between; gap: 10px;
            }
            .stack-table td::before {
                content: attr(data-label); color: var(--text-tertiary);
                font-size: 0.72rem; font-weight: 500;
            }
            .stack-table td:first-child { border-radius: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

<div id="toast" role="status" aria-live="polite"></div>

<!-- 鉴权遮罩 -->
<div id="loginOverlay">
    <div class="card" style="width: 100%; max-width: 340px; margin: 0;">
        <div class="header" style="margin-bottom: 20px;">
            <h1>后台<span class="accent">鉴权</span></h1>
        </div>
        <input type="password" id="pwdInput" placeholder="输入管理员密码..." style="margin-bottom: 16px;" onkeydown="if(event.key==='Enter') doLogin()">
        <button class="btn" onclick="doLogin()">进入控制台</button>
    </div>
</div>

<div class="container" id="adminDashboard">

    <!-- 顶栏状态 -->
    <div class="header">
        <h1>后台<span class="accent">控制台</span></h1>
        <div style="font-size: 0.82rem; color: var(--text-secondary); margin-top: 8px; cursor: pointer;" onclick="logout()">退出登录</div>
    </div>

    <!-- 数据看板 -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-value" id="statCount">0</div>
            <div class="stat-label">总份数</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="statMoney">¥0</div>
            <div class="stat-label">总金额</div>
        </div>
    </div>

    <!-- 商家报单 -->
    <div class="card">
        <div class="section-header">
            <div class="section-title">
                <span class="section-icon purple">👨‍🍳</span>
                后厨报单
            </div>
            <button class="btn-copy" onclick="copyMerchantOrder()">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                复制发给老板
            </button>
        </div>
        <table class="stack-table">
            <thead><tr><th>菜品</th><th>数量</th><th>小计</th></tr></thead>
            <tbody id="merchantList">
            <tr><td colspan="3" style="text-align:center; color:var(--text-tertiary);">加载中...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- 代客补单 -->
    <div class="card">
        <div class="section-header" style="margin-bottom: 5px;">
            <div class="section-title">
                <span class="section-icon mint">✍️</span>
                帮点一下
            </div>
        </div>
        <div class="form-row">
            <select id="manualName"><option value="">名字...</option></select>
            <select id="manualFood"><option value="">餐品...</option></select>
            <button class="btn" style="box-shadow: none;" onclick="submitManualOrder()">添加</button>
        </div>
    </div>

    <!-- 定时设置 -->
    <div class="card">
        <div class="section-header">
            <div class="section-title">
                <span class="section-icon mint">⏰</span>
                定时设置
            </div>
            <span id="scheduleStatus" class="status-pill">读取中…</span>
        </div>

        <label class="switch-row">
            <input type="checkbox" id="scheduleEnabled">
            <span>只在以下时间段内允许点单</span>
        </label>

        <div class="time-row">
            <div>
                <label class="mini-label" for="openTime">开始</label>
                <input type="time" id="openTime" value="06:00">
            </div>
            <div class="time-sep">–</div>
            <div>
                <label class="mini-label" for="closeTime">结束</label>
                <input type="time" id="closeTime" value="10:30">
            </div>
        </div>
        <p class="tiny-hint">支持跨零点，例如 22:00 – 02:00。起止相同表示全天开放。</p>

        <div class="field" style="margin-top:12px;">
            <label class="mini-label" for="closedMessage">封盘时页面上显示</label>
            <input type="text" id="closedMessage" maxlength="60" placeholder="今天点单已结束">
        </div>

        <label class="switch-row" style="margin-top:10px;">
            <input type="checkbox" id="autoDailyReset" checked>
            <span>每天首次打开时自动清空昨天的订单</span>
        </label>

        <div class="btn-row">
            <button class="btn btn-primary" id="saveScheduleBtn" type="button">保存设置</button>
            <button class="btn btn-ghost" id="startNewDayBtn" type="button">开始新一天</button>
            <button class="btn btn-ghost" id="clearNowBtn" type="button">只清空订单</button>
        </div>
    </div>

    <!-- 订单明细 -->
    <div class="card">
        <div class="section-header">
            <div class="section-title">
                <span class="section-icon purple">📋</span>
                订单明细
            </div>
            <button class="btn-copy" onclick="exportCSV()">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                导出表格
            </button>
        </div>
        <div id="detailedList">
            <div style="text-align: center; padding: 20px; color: var(--text-tertiary);">加载中...</div>
        </div>
    </div>

    <!-- 危险操作 -->
    <div class="card" style="border-color: var(--border-soft);">
        <button class="btn btn-danger" onclick="forceClearAll()">⚠️ 清空所有数据</button>
    </div>

</div>

<script>
    /* =========================================================
       Admin Console v2
       - State 集中管理
       - API 请求统一封装
       - Render 纯渲染
       - Action 统一处理
       - 自动刷新可控、避免重复请求
       ========================================================= */

    const CONFIG = Object.freeze({
        API_URL: 'https://api.yukiom.us.ci/',
        REFRESH_INTERVAL: 15000,
        NAMES: Object.freeze(['周', '陈', '袁', '范', '祝', '何', '黄', '宋', '朱']),
        MENU: Object.freeze([
            { name: '炒饭', price: 6 },
            { name: '炒粉', price: 7 },
            { name: '汤粉', price: 5 },
            { name: '炒河粉', price: 6 },
            { name: '饭', price: 6 },
            { name: '面', price: 5 },
            { name: '面+蛋', price: 6 },
            { name: '汤粉+蛋', price: 6 },
            { name: '白饭', price: 2 },
            { name: '拌面', price: 6 },
            { name: '拌粉', price: 6 },
            { name: '水饺', price: 6 },
            { name: '混沌', price: 6 },

        ])
    });

    const state = {
        orders: [],
        loading: false,
        initialized: false,
        refreshTimer: null,
        requestId: 0,
        schedule: null      // 服务端当前的定时状态
    };

    const $ = (id) => document.getElementById(id);

    const storage = {
        getPassword() {
            return sessionStorage.getItem('adminPassword') || '';
        },
        setPassword(value) {
            sessionStorage.setItem('adminPassword', value);
        },
        clearPassword() {
            sessionStorage.removeItem('adminPassword');
        },
        getDeviceToken() {
            let token = localStorage.getItem('deviceToken');
            if (!token) {
                token = crypto?.randomUUID?.() ||
                    `${Math.random().toString(36).slice(2)}${Date.now()}`;
                localStorage.setItem('deviceToken', token);
            }
            return token;
        }
    };

    const session = {
        get password() {
            return storage.getPassword();
        },
        login(password) {
            storage.setPassword(password);
        },
        logout() {
            storage.clearPassword();
            state.orders = [];
            stopAutoRefresh();
            renderAll();
        },
        isAuthenticated() {
            return Boolean(this.password);
        }
    };

    const deviceToken = storage.getDeviceToken();

    /* -------------------- Utilities -------------------- */

    function escapeHtml(value) {
        const div = document.createElement('div');
        div.textContent = value == null ? '' : String(value);
        return div.innerHTML;
    }

    function formatMoney(value) {
        const number = Number(value) || 0;
        return `¥${number.toFixed(0)}`;
    }

    function formatTime(timestamp) {
        if (!timestamp) return '-';

        const date = new Date(timestamp);
        if (Number.isNaN(date.getTime())) return '-';

        return date.toLocaleTimeString('zh-CN', {
            hour: '2-digit',
            minute: '2-digit',
            hour12: false
        });
    }

    function formatDateTime(timestamp) {
        if (!timestamp) return '-';

        const date = new Date(timestamp);
        if (Number.isNaN(date.getTime())) return '-';

        return date.toLocaleString('zh-CN');
    }

    function normalizeOrders(data) {
        if (!Array.isArray(data)) return [];

        return data
            .filter(Boolean)
            .map((order) => ({
                name: String(order.name ?? ''),
                food: String(order.food ?? ''),
                price: Number(order.price) || 0,
                time: Number(order.time) || 0
            }))
            .filter(order => order.name && order.food);
    }

    function getMenuItem(foodName) {
        return CONFIG.MENU.find(item => item.name === foodName) || null;
    }

    function getOrderTotal(orders = state.orders) {
        return orders.reduce((total, order) => total + order.price, 0);
    }

    function getFoodSummary(orders = state.orders) {
        const map = new Map();

        for (const order of orders) {
            const existing = map.get(order.food);

            if (existing) {
                existing.count += 1;
            } else {
                map.set(order.food, {
                    food: order.food,
                    count: 1,
                    price: order.price
                });
            }
        }

        return [...map.values()];
    }

    function getOrderedNames() {
        return new Set(state.orders.map(order => order.name));
    }

    /* -------------------- Toast -------------------- */

    let toastTimer = null;

    function showToast(message, isError = false) {
        const toast = $('toast');
        if (!toast) return;

        toast.textContent = `${isError ? '⚠️' : '✅'} ${message}`;
        toast.style.background = isError
            ? 'rgba(255, 70, 100, 0.92)'
            : 'rgba(45, 35, 50, 0.92)';

        toast.classList.add('show');

        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }

    /* -------------------- API Layer -------------------- */

    async function apiRequest(path = '', options = {}) {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 10000);

        try {
            const response = await fetch(CONFIG.API_URL + path, {
                ...options,
                signal: controller.signal,
                headers: {
                    ...(options.body ? { 'Content-Type': 'application/json' } : {}),
                    ...(options.headers || {})
                }
            });

            const contentType = response.headers.get('content-type') || '';
            const data = contentType.includes('application/json')
                ? await response.json()
                : await response.text();

            if (!response.ok) {
                const error = new Error(
                    typeof data === 'string'
                        ? data || `HTTP ${response.status}`
                        : data?.message || `HTTP ${response.status}`
                );
                error.status = response.status;
                error.data = data;
                throw error;
            }

            return data;
        } finally {
            clearTimeout(timeout);
        }
    }

    const API = {
        async getOrders() {
            return normalizeOrders(await apiRequest());
        },

        async createOrder({ name, food, price }) {
            return apiRequest('', {
                method: 'POST',
                body: JSON.stringify({
                    name,
                    food,
                    price,
                    time: Date.now(),
                    token: deviceToken
                })
            });
        },

        async deleteOrder(name) {
            return apiRequest('', {
                method: 'DELETE',
                body: JSON.stringify({
                    name,
                    adminPassword: session.password
                })
            });
        },

        async clearOrders() {
            return apiRequest('', {
                method: 'DELETE',
                body: JSON.stringify({
                    adminPassword: session.password
                })
            });
        },

        /* ---- 定时设置 ---- */

        async getSettings() {
            const pwd = encodeURIComponent(session.password);
            return apiRequest(`settings?adminPassword=${pwd}`);
        },

        async updateSettings(patch) {
            return apiRequest('settings', {
                method: 'POST',
                body: JSON.stringify({ action: 'update', adminPassword: session.password, ...patch })
            });
        },

        async clearNowSettings() {
            return apiRequest('settings', {
                method: 'POST',
                body: JSON.stringify({ action: 'clearNow', adminPassword: session.password })
            });
        },

        async startNewDay() {
            return apiRequest('settings', {
                method: 'POST',
                body: JSON.stringify({ action: 'startNewDay', adminPassword: session.password })
            });
        }
    };

    /* -------------------- State / Data -------------------- */

    async function fetchData({ silent = false } = {}) {
        if (state.loading) return;

        const currentRequest = ++state.requestId;
        state.loading = true;

        if (!silent) {
            setLoadingState(true);
        }

        try {
            const orders = await API.getOrders();

            // 如果期间又发起了更新请求，丢弃旧请求结果。
            if (currentRequest !== state.requestId) return;

            state.orders = orders;
            renderAll();
        } catch (error) {
            if (!silent) {
                showToast(
                    error.name === 'AbortError'
                        ? '请求超时'
                        : '无法获取订单数据',
                    true
                );
            }
            console.error('[Admin] fetchData:', error);
        } finally {
            if (currentRequest === state.requestId) {
                state.loading = false;
                setLoadingState(false);
            }
        }
    }

    function setLoadingState(isLoading) {
        const button = document.querySelector('[onclick="submitManualOrder()"]');
        if (!button) return;

        button.disabled = isLoading;
        button.style.opacity = isLoading ? '0.65' : '';
        button.textContent = isLoading ? '同步中…' : '添加';
    }

    function startAutoRefresh() {
        stopAutoRefresh();

        state.refreshTimer = setInterval(() => {
            if (session.isAuthenticated() && !document.hidden) {
                fetchData({ silent: true });
            }
        }, CONFIG.REFRESH_INTERVAL);
    }

    function stopAutoRefresh() {
        if (state.refreshTimer) {
            clearInterval(state.refreshTimer);
            state.refreshTimer = null;
        }
    }

    /* -------------------- 定时设置 -------------------- */

    /** 把服务端状态画到面板上 */
    function renderSchedule() {
        const s = state.schedule;
        if (!s) return;

        $('scheduleEnabled').checked = !!s.enabled;
        $('autoDailyReset').checked = !!s.autoDailyReset;
        $('openTime').value = s.openTime || '06:00';
        $('closeTime').value = s.closeTime || '10:30';
        $('closedMessage').value = s.message || '';

        const pill = $('scheduleStatus');
        if (!s.enabled) {
            pill.textContent = '未启用时段限制';
            pill.className = 'status-pill';
        } else if (s.open) {
            pill.textContent = '开放中';
            pill.className = 'status-pill is-open';
        } else {
            pill.textContent = '已封盘';
            pill.className = 'status-pill is-closed';
        }

        // 未启用时段时，时间输入没有意义，置灰以示区分
        ['openTime', 'closeTime'].forEach(id => { $(id).disabled = !s.enabled; });
    }

    async function fetchSettings() {
        try {
            const data = await API.getSettings();
            state.schedule = data.state || null;
            renderSchedule();

            // 服务端返回的 settings 与 state 合并后回填输入框，
            // 保证用户看到的是「服务器上真正生效的值」而不是本地改动
            if (data.settings) {
                state.schedule = { ...data.settings, ...data.state };
                renderSchedule();
            }
        } catch (error) {
            if (error?.status === 403 || error?.status === 401) {
                handleAuthError(error);
                return;
            }
            // 后端还没更新到支持 /settings 时，这里会 404/405 —— 提示一次即可
            $('scheduleStatus').textContent = '读取失败';
            $('scheduleStatus').className = 'status-pill is-closed';
            console.error('[Admin] fetchSettings:', error);
        }
    }

    async function saveSchedule() {
        const btn = $('saveScheduleBtn');
        btn.disabled = true;
        btn.textContent = '保存中…';

        try {
            const res = await API.updateSettings({
                scheduleEnabled: $('scheduleEnabled').checked,
                autoDailyReset: $('autoDailyReset').checked,
                openTime: $('openTime').value,
                closeTime: $('closeTime').value,
                closedMessage: $('closedMessage').value
            });
            showToast(res.message || '设置已保存');
            await fetchSettings();
        } catch (error) {
            if (!handleAuthError(error)) showToast(error.message || '保存失败', 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = '保存设置';
        }
    }

    async function startNewDay() {
        if (!confirm('清空当前订单并记为「今天」？通常用于手动开启新一天的点单。')) return;
        try {
            const res = await API.startNewDay();
            showToast(res.message || '已开始新一天');
            await fetchData();
            await fetchSettings();
        } catch (error) {
            if (!handleAuthError(error)) showToast(error.message || '操作失败', 'error');
        }
    }

    async function clearOrdersNow() {
        if (!confirm('只清空订单，不改变日期记录。确定继续？')) return;
        try {
            const res = await API.clearNowSettings();
            showToast(res.message || '已清空订单');
            await fetchData();
            await fetchSettings();
        } catch (error) {
            if (!handleAuthError(error)) showToast(error.message || '操作失败', 'error');
        }
    }

    /* -------------------- Render Layer -------------------- */

    function renderStats() {
        $('statCount').textContent = state.orders.length;
        $('statMoney').textContent = formatMoney(getOrderTotal());
    }

    function renderMerchantSummary() {
        const tbody = $('merchantList');
        const summary = getFoodSummary();

        if (!summary.length) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="3" style="text-align:center;color:var(--text-tertiary);">
                        暂无数据
                    </td>
                </tr>`;
            return;
        }

        // data-label 供窄屏卡片式布局显示行内标签（.stack-table td::before）
        tbody.innerHTML = summary.map(item => `
            <tr>
                <td data-label="菜品">${escapeHtml(item.food)}</td>
                <td data-label="数量"><span class="count-badge">${item.count}</span></td>
                <td data-label="小计" style="font-weight:800;color:var(--accent-pink-deep);">
                    ${formatMoney(item.count * item.price)}
                </td>
            </tr>
        `).join('');
    }

    function renderDetailedList() {
        const list = $('detailedList');

        if (!state.orders.length) {
            list.innerHTML = `
                <div style="text-align:center;padding:20px;color:var(--text-tertiary);">
                    暂无数据
                </div>`;
            return;
        }

        const sorted = [...state.orders].sort((a, b) => b.time - a.time);

        list.innerHTML = sorted.map(order => `
            <div class="order-row">
                <div class="order-main">
                    <span class="order-name">
                        ${escapeHtml(order.name)}
                        <span class="tag">
                            ${escapeHtml(order.food)} (${formatMoney(order.price)})
                        </span>
                    </span>
                    <span class="order-time">
                        <svg width="11" height="11" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2.5"
                             stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        ${formatTime(order.time)}
                    </span>
                </div>

                <div class="order-right">
                    <button class="btn-delete"
                            type="button"
                            data-action="delete-order"
                            data-name="${escapeHtml(order.name)}"
                            aria-label="撤销 ${escapeHtml(order.name)}">
                        <svg width="13" height="13" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2.5"
                             stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
            </div>
        `).join('');
    }

    function renderManualForm() {
        const nameSelect = $('manualName');
        const foodSelect = $('manualFood');
        const currentName = nameSelect.value;
        const currentFood = foodSelect.value;
        const orderedNames = getOrderedNames();

        nameSelect.innerHTML = [
            '<option value="">名字...</option>',
            ...CONFIG.NAMES.map(name => {
                const ordered = orderedNames.has(name);
                return `
                    <option value="${escapeHtml(name)}" ${ordered ? 'disabled' : ''}>
                        ${escapeHtml(name)}${ordered ? ' (已点)' : ''}
                    </option>`;
            })
        ].join('');

        foodSelect.innerHTML = [
            '<option value="">餐品...</option>',
            ...CONFIG.MENU.map(item => `
                <option value="${escapeHtml(item.name)}">
                    ${escapeHtml(item.name)} (${formatMoney(item.price)})
                </option>
            `)
        ].join('');

        if (currentName && !orderedNames.has(currentName)) {
            nameSelect.value = currentName;
        }

        if (currentFood && getMenuItem(currentFood)) {
            foodSelect.value = currentFood;
        }
    }

    function renderAll() {
        renderStats();
        renderMerchantSummary();
        renderDetailedList();
        renderManualForm();
    }

    /* -------------------- Theme -------------------- */

    /*
     * 配色已固定为深色霓虹，与点饭页一致，不再提供浅色主题。
     * 原来这里有一套 initTheme / applyTheme / toggleTheme 加右上角按钮，
     * 但两套令牌已经改成同值 —— 按下去只有图标在 🌙/☀️ 之间翻，页面毫无变化，
     * 对不熟悉的人就是「按钮坏了」。整组连同按钮一起移除。
     */
    function applyTheme() {
        document.documentElement.setAttribute('data-theme', 'dark');
    }

    /* -------------------- Auth -------------------- */

    function renderAuth() {
        const authenticated = session.isAuthenticated();

        $('loginOverlay').style.display = authenticated ? 'none' : 'flex';
        $('adminDashboard').style.display = authenticated ? 'block' : 'none';
    }

    async function doLogin() {
        const input = $('pwdInput');
        const password = input.value.trim();

        if (!password) {
            showToast('请输入密码', true);
            input.focus();
            return;
        }

        /*
         * 这里刻意不在前端比对密码。
         * 旧版写死了 if (password !== '123')，任何人查看源码即可得知密码，
         * 而且改掉 sessionStorage 就能绕过 —— 前端校验不是安全边界。
         * 现在只把密码存下来，由后端在每个请求上验证；错了会在 fetchData 里
         * 收到 403，由 handleAuthError 退回登录页。
         */
        session.login(password);
        input.value = '';

        renderAuth();
        await initApplication();
        await fetchData();
        await fetchSettings();
    }

    function logout() {
        session.logout();
        renderAuth();
        $('pwdInput').value = '';
    }

    function handleAuthError(error) {
        if (error?.status === 401 || error?.status === 403) {
            logout();
            showToast('管理员密码无效，请重新登录', true);
            return true;
        }
        return false;
    }

    /* -------------------- Actions -------------------- */

    async function submitManualOrder() {
        const name = $('manualName').value;
        const foodName = $('manualFood').value;
        const food = getMenuItem(foodName);

        if (!name || !food) {
            showToast('请选好名字和餐品', true);
            return;
        }

        // 前端先拦截重复下单，减少无意义请求。
        if (getOrderedNames().has(name)) {
            showToast(`${name} 已经点过了`, true);
            renderManualForm();
            return;
        }

        try {
            setLoadingState(true);

            await API.createOrder({
                name,
                food: food.name,
                price: food.price
            });

            $('manualName').value = '';
            $('manualFood').value = '';

            showToast(`已添加 ${name} 的订单`);
            await fetchData({ silent: true });
        } catch (error) {
            console.error('[Admin] submitManualOrder:', error);

            if (!handleAuthError(error)) {
                showToast('添加失败，请稍后重试', true);
            }
        } finally {
            setLoadingState(false);
        }
    }

    async function forceDeleteOrder(name) {
        if (!name) return;
        if (!confirm(`撤销 ${name} 的订单？`)) return;

        try {
            await API.deleteOrder(name);

            // 立即更新本地 UI，再向服务器同步。
            state.orders = state.orders.filter(order => order.name !== name);
            renderAll();

            showToast(`已撤销 ${name}`);
            await fetchData({ silent: true });
        } catch (error) {
            console.error('[Admin] forceDeleteOrder:', error);

            if (!handleAuthError(error)) {
                showToast('撤销失败，请稍后重试', true);
            }
        }
    }

    async function forceClearAll() {
        if (!state.orders.length) {
            showToast('当前没有订单', true);
            return;
        }

        if (!confirm(`确认清空全部 ${state.orders.length} 份订单？此操作不可恢复。`)) {
            return;
        }

        try {
            await API.clearOrders();

            state.orders = [];
            renderAll();

            showToast('已清空全部数据');
            await fetchData({ silent: true });
        } catch (error) {
            console.error('[Admin] forceClearAll:', error);

            if (!handleAuthError(error)) {
                showToast('清空失败，请稍后重试', true);
            }
        }
    }

    /* -------------------- Export / Clipboard -------------------- */

    function buildMerchantText() {
        const summary = getFoodSummary();

        if (!summary.length) return '';

        const count = state.orders.length;
        const total = getOrderTotal();

        const lines = summary.map(item =>
            `${item.food} × ${item.count}份`
        );

        return [
            '老板，今日单：',
            '',
            ...lines,
            '',
            `共计: ${count}份，总价: ${formatMoney(total)}`
        ].join('\n');
    }

    async function copyText(text) {
        if (!text) {
            showToast('暂无数据', true);
            return;
        }

        try {
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(text);
            } else {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.cssText = 'position:fixed;left:-9999px;';
                document.body.appendChild(textarea);
                textarea.select();

                const success = document.execCommand('copy');
                textarea.remove();

                if (!success) throw new Error('clipboard fallback failed');
            }

            showToast('复制成功');
        } catch (error) {
            console.error('[Admin] copy:', error);
            showToast('复制失败，请手动复制', true);
        }
    }

    function copyMerchantOrder() {
        copyText(buildMerchantText());
    }

    function csvCell(value) {
        return `"${String(value ?? '').replace(/"/g, '""')}"`;
    }

    function exportCSV() {
        if (!state.orders.length) {
            showToast('暂无数据', true);
            return;
        }

        const rows = [
            ['姓名', '餐品', '价格', '下单时间'],
            ...[...state.orders]
                .sort((a, b) => b.time - a.time)
                .map(order => [
                    order.name,
                    order.food,
                    `¥${order.price}`,
                    formatDateTime(order.time)
                ])
        ];

        const csv = '\uFEFF' + rows
            .map(row => row.map(csvCell).join(','))
            .join('\r\n');

        const blob = new Blob([csv], {
            type: 'text/csv;charset=utf-8;'
        });

        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');

        link.href = url;
        link.download =
            `点餐明细_${new Date().getMonth() + 1}月${new Date().getDate()}日.csv`;

        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => URL.revokeObjectURL(url), 1000);

        showToast('CSV 导出成功');
    }

    /* -------------------- Events -------------------- */

    function bindEvents() {
        // 保留原有 onclick API，同时增加事件委托，避免给每一行创建大量 handler。
        $('detailedList').addEventListener('click', (event) => {
            const button = event.target.closest('[data-action="delete-order"]');
            if (!button) return;

            forceDeleteOrder(button.dataset.name);
        });

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && session.isAuthenticated()) {
                fetchData({ silent: true });
            }
        });

        window.addEventListener('online', () => {
            if (session.isAuthenticated()) {
                showToast('网络已恢复，正在同步');
                fetchData({ silent: true });
            }
        });

        window.addEventListener('offline', () => {
            showToast('网络连接已断开', true);
        });

        // 定时设置
        $('saveScheduleBtn').addEventListener('click', saveSchedule);
        $('startNewDayBtn').addEventListener('click', startNewDay);
        $('clearNowBtn').addEventListener('click', clearOrdersNow);
        // 勾选框变化时立即让时间输入框的可用状态跟上
        $('scheduleEnabled').addEventListener('change', (e) => {
            ['openTime', 'closeTime'].forEach(id => { $(id).disabled = !e.target.checked; });
        });
    }

    /* -------------------- Boot -------------------- */

    async function initApplication() {
        if (state.initialized) {
            startAutoRefresh();
            return;
        }

        state.initialized = true;
        bindEvents();
        renderAll();
        startAutoRefresh();
    }

    async function boot() {
        applyTheme();

        /*
         * 旧版把管理密码写死为 '123' 并存在 sessionStorage 里。
         * 那个键（以及旧的明文密码）不能再被当成已登录凭证使用 —— 清掉，
         * 让所有人重新用服务端校验过的密码登录。
         */
        if (session.password === '123') {
            session.logout();
        }

        renderAuth();

        if (!session.isAuthenticated()) {
            $('pwdInput')?.focus();
            return;
        }

        await initApplication();
        await fetchData();
        await fetchSettings();
    }

    boot();

</script>
</body>
</html>
