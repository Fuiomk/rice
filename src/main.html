                name, food: food.name, price: food.price, time: Date.now(), token: deviceToken
            });
            showToast(`点餐成功！${food.icon} ${food.name}`);
            localStorage.setItem('myOrderName', name);
            await fetchData();
        } catch (e) {
            showToast(e.message || '提交失败了 (╥_╥)', 'error');
        } finally {
            state.isSubmitting = false;
            updateSubmitButton();
        }
    }

    // ============ 确认弹窗 ============
    // 替代原生 confirm：样式可定制、不打断整页观感，且能把焦点管理做对。
    let modalResolve = null;

    function closeModal(result) {
        const modal = document.getElementById('modal');
        if (modal.hidden) return;
        modal.hidden = true;
        document.documentElement.style.removeProperty('overflow');
        const resolve = modalResolve;
        modalResolve = null;
        if (resolve) resolve(result);
    }

    function askConfirm(descHtml, confirmText = '确认撤销') {
        const modal = document.getElementById('modal');
        document.getElementById('modalDesc').innerHTML = descHtml;
        document.getElementById('modalConfirm').textContent = confirmText;
        modal.hidden = false;
        // 锁定背景滚动，避免弹窗开着时页面还在滚
        document.documentElement.style.overflow = 'hidden';
        // 焦点给「再想想」而不是「确认」：误触回车时不会直接执行破坏性操作
        requestAnimationFrame(() => document.getElementById('modalCancel').focus());

        return new Promise(resolve => { modalResolve = resolve; });
    }

    function initModal() {
        const modal = document.getElementById('modal');
        document.getElementById('modalCancel').addEventListener('click', () => closeModal(false));
        document.getElementById('modalConfirm').addEventListener('click', () => closeModal(true));
        // 点遮罩关闭
        modal.querySelector('.modal-backdrop').addEventListener('click', () => closeModal(false));
        // Esc 关闭
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !modal.hidden) closeModal(false);
        });
    }

    async function cancelPersonalOrder(name) {
        if (!name) return;
        const ok = await askConfirm(
            `确定撤销 <b>${escapeHtml(name)}</b> 的订单吗？<br>撤销后需要重新点餐。`
        );
        if (!ok) return;
        try {
            await deleteOrderFromServer(name);
            showToast(`已撤销 ${name} 的订单 ♪`);
            // 撤销后回到「还没点」的状态，而不是把界面锁死
            if (localStorage.getItem('myOrderName') === name) {
                localStorage.removeItem('myOrderName');
                state.selectedFoodIdx = null;
                state.selectedName = null;
                syncFoodSelection();
                renderNameGrid();
            }
            await fetchData();
        } catch (e) {
            showToast(e.message || '撤销失败了～', 'error');
        }
    }

    function copySummaryText() {
        if (!state.orders.length) return showToast('还没有数据哦～', 'error');

        const now = new Date();
        const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;

        let text = `📋 今日点饭汇总 (${timeStr})\n═══════════════════\n`;
        let totalAll = 0, totalCount = 0;

        CONFIG.MENU.forEach(m => {
            const count = state.orders.filter(o => o.food === m.name).length;
            if (count > 0) {
                const sub = count * m.price;
                totalAll += sub; totalCount += count;
                text += `${m.icon} ${m.name} × ${count}份 = ¥${sub}\n`;
            }
        });

        text += `───────────────────\n💰 总金额: ¥${totalAll}（共${totalCount}份）\n\n👤 详细：\n`;
        const sorted = [...state.orders].sort((a, b) => (b.time || 0) - (a.time || 0));
        sorted.forEach(o => text += `  ${o.name} → ${o.food}\n`);

        const doFallback = () => {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.cssText = 'position:fixed;left:-9999px;';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); showToast('复制成功 ♡'); }
            catch(_) { showToast('复制失败...', 'error'); }
            ta.remove();
        };

        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text)
                .then(() => showToast('复制成功！(◕‿◕✿)'))
                .catch(doFallback);
        } else {
            doFallback();
        }
    }

    // ============ 初始化 ============
    async function init() {
        applyTheme();
        renderFoodGrid();
        initModal();

        document.getElementById('submitBtn').addEventListener('click', handlePrimaryAction);
        document.getElementById('copyBtn').addEventListener('click', copySummaryText);
        document.getElementById('deckToggle').addEventListener('click', () => {
            tapFeedback(6);
            toggleDeck();
        });
        document.getElementById('randomBtn').addEventListener('click', randomPickFood);

        // 名字点选：事件委托，单击即选
        document.getElementById('nameGrid').addEventListener('click', (e) => {
            const btn = e.target.closest('.name-btn');
            if (btn && !btn.disabled) selectName(btn.dataset.name);
        });

        // 菜单默认折叠：初始只展示前 PREVIEW_ROWS 行
        setDeckCollapsed(true);

        // 跨断点改列数时，可见数量会从 4 变成 6，必须重新同步给 CSS
        window.addEventListener('resize', () => {
            applyPreviewCount();
            // 列数变少时，原本可见的项可能被挤到预览范围外，同步一下选择状态
            if (state.selectedFoodIdx !== null
                && document.getElementById('foodGrid').classList.contains('is-collapsed')
                && !visibleIndices().has(state.selectedFoodIdx)) {
                setDeckCollapsed(true);
            }
        });

        // 餐品选择用事件委托 + 键盘支持：
        // 事件委托让格子重建后不必重新绑定，键盘支持让 Enter/Space 也能选。
        const grid = document.getElementById('foodGrid');
        grid.addEventListener('click', (e) => {
            const item = e.target.closest('.food-item');
            if (item) selectFood(Number(item.dataset.idx));
        });
        grid.addEventListener('keydown', (e) => {
            if (e.key !== 'Enter' && e.key !== ' ') return;
            const item = e.target.closest('.food-item');
            if (!item) return;
            e.preventDefault();
            selectFood(Number(item.dataset.idx));
        });

        document.getElementById('orderDetailList').addEventListener('click', (e) => {
            const btn = e.target.closest('.btn-delete');
            if (btn) cancelPersonalOrder(btn.dataset.name);
        });

        await fetchData();
        setInterval(fetchData, CONFIG.REFRESH_INTERVAL);
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
